services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: TODO
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cadence}
      # 容器内建库用 UTF8 + 中文排序安全
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - cadence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d TODO"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: services/cadence-core/Dockerfile
    environment:
      CORE_PORT: "18080"
      # 默认 TODO（演示库）；想切到评测库就设 CORE_DB_URL，例如：
      #   $env:CORE_DB_URL='jdbc:postgresql://postgres:5432/benchmark'
      #   docker compose up -d --force-recreate core
      DB_URL: ${CORE_DB_URL:-jdbc:postgresql://postgres:5432/TODO}
      DB_USER: ${CORE_DB_USER:-cadence}
      DB_PASSWORD: ${DB_PASSWORD:-cadence}
      # 容器里没有 ../cadence-web；Dockerfile 把静态文件拷到 /app/web
      CORE_WEB_DIR: /app/web
    ports:
      - "18080:18080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: services/cadence-agent/Dockerfile
    environment:
      CORE_BASE_URL: http://core:18080
      LLM_MODE: ${LLM_MODE:-auto}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_FAST_MODEL: ${DEEPSEEK_FAST_MODEL:-deepseek-chat}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      DATA_DIR: /data/agent
      # 评测时设为 2026-11-08T10:30:00+08:00；日常留空走真实时间
      EVAL_FROZEN_NOW: ${EVAL_FROZEN_NOW:-}
    ports:
      - "18000:18000"
    volumes:
      - cadence_agent_data:/data/agent
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  # 不写死 name：由 compose 项目名决定（仓库目录名 / -p 参数），
  # 这样同一台机器上 clone 多份、或换目录重跑都不会撞卷。
  cadence_pgdata:
  cadence_agent_data:
