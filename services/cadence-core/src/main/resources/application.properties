spring.application.name=cadence-core
server.port=${CORE_PORT:18080}

# ---------- 数据源 ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/TODO}
spring.datasource.username=${DB_USER:cadence}
spring.datasource.password=${DB_PASSWORD:cadence}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000

# ---------- JPA ----------
# ddl-auto 必须是 none：表结构由 Flyway 管，JPA 不许自己建表
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Jackson ----------
# Boot 4 使用 Jackson 3（tools.jackson）。
# 这两个属性在 Jackson 3 中都已移除，且默认行为就是我们要的：
#   - write-dates-as-timestamps  → 默认输出 ISO-8601
#   - adjust-dates-to-context-time-zone → 已不存在
# 所以此处不做任何 Jackson 配置。若日后要改序列化行为，用 Jackson2ObjectMapper 的等价 API。

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
