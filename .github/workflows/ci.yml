name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Agent：单测 + 边界测试（不依赖 Core / 数据库 / 真实模型）
  # ---------------------------------------------------------------------------
  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/cadence-agent/pyproject.toml
            evals/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/cadence-agent[dev]"
          pip install -r evals/requirements.txt

      - name: pytest (unit + boundary + integration)
        working-directory: services/cadence-agent
        env:
          PYTHONPATH: src:tests
        run: python -m pytest tests -q --disable-warnings

      - name: pytest (evals)
        env:
          PYTHONPATH: services/cadence-agent/src
        run: python -m pytest evals/tests -q

  # ---------------------------------------------------------------------------
  # 评测冒烟：fake 模式跑完 35 条，必须 35/35。
  # 这是"改了 prompt / 工具 / 路由，功能没退化"的最短证据链。
  # ---------------------------------------------------------------------------
  eval-smoke:
    name: Eval smoke (35 cases, fake)
    runs-on: ubuntu-latest
    needs: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/cadence-agent/pyproject.toml
            evals/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e services/cadence-agent
          pip install -r evals/requirements.txt

      - name: Run fake eval
        env:
          PYTHONPATH: services/cadence-agent/src
        run: |
          python -m evals.cli run --all --llm fake --core fake --out .tmp/eval
          # 必须 35/35；否则说明数据集、评测器或 Agent 装配被改坏了
          grep -q "35/35" .tmp/eval/*.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: .tmp/eval/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Core：Maven verify（Testcontainers 起真 PostgreSQL）
  # ---------------------------------------------------------------------------
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        working-directory: services/cadence-core
        run: mvn -B -q verify

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/cadence-core/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
